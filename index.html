<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Image AI Editor</title>
</head>
<body>
    <h1>Image AI Editor</h1>
    <input type="file" id="imageUpload" accept="image/*">
    <textarea id="transformationDescription" placeholder="Describe tu transformación..."></textarea>
    <button id="editButton">Transformar Imagen</button>
    <div id="imagePreview"></div>
    <a id="downloadLink" style="display: none;">Descargar Imagen Editada</a>
    <script src="script.js"></script>
</body>
</html>
